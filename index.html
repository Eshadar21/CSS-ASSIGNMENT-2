<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bg-color">
      <div id="main-div">
        <div>
          <img
            src="./pictures/ant.jpg"

            height="250px"
            width="100%"
          />
        </div>

        <div id="image-girl">
          <img
            src="./pictures/girl.png"
            alt="This is a image"
            height="150px"
            width="100%"
          />
        </div>
        <div class="name">
          <h1>Meerna Meeba</h1>
          <p style="opacity: 0.7">Ant Collector</p>
        </div>

        <div class="follower">
          <p style="color: blue; font-size: 25px">120</p>
          <p style="opacity: 0.7; margin-top: -15px; font-size: 15px">
            Followers
          </p>
        </div>

        <div class="following">
          <p style="color: blue; font-size: 25px">100</p>
          <p style="opacity: 0.7; margin-top: -15px; font-size: 15px">
            Following
          </p>
        </div>

        <div>
          <a href="">Follow</a>
        </div>

        <div class="about">
          <p>
            She is collecting ants since she was six and uptill now she had
            collected a dozens of ants of varies types. now she has a whole
            colony of ants.
          </p>
        </div>
      </div>
    </div>
